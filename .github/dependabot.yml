# Weekly dependency updates (TASK-162). Minor and patch updates arrive as one
# grouped PR; major versions are upgraded on purpose in the code-quality plan's
# phase 7, one PR per package, so Dependabot does not propose them. Only one
# update PR is open at a time because each one touches package.json and the
# lockfile, which only one PR may change at a time (DEC-200).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Taipei
    open-pull-requests-limit: 1
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Taipei
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ['*']
